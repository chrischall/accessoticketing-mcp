version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # First matching group wins, so this must precede dev-dependencies.
      # vitest and @vitest/coverage-v8 peer-depend on each other at an exact
      # version — bumping either alone makes the peer set unsatisfiable and
      # `npm ci` dies. dev-dependencies only covers minor/patch, so a major
      # would otherwise escape as two separate, individually-red PRs.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
